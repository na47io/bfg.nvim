# BFG tmux theme - synced with bfg.nvim colorscheme
# Minimal tmux configuration using exact bfg.nvim colors

# Status bar
set -g status-bg '#2a3b3b'
set -g status-fg '#C2BDA1'
set -g status-style 'none'
set -g status-left ''
set -g status-right ''
set -g status-justify centre
set -g status-position bottom

# Window status
set -g window-status-current-style 'bg=#022B2B,fg=#C2BDA1'
set -g window-status-current-format ' #I:#W '

set -g window-status-style 'bg=#2a3b3b,fg=#4a5a5a'
set -g window-status-format ' #I:#W '

# Pane borders
set -g pane-border-style 'fg=#4a5a5a'
set -g pane-active-border-style 'fg=#6b8b6b'

# Message text
set -g message-style 'bg=#2a3b3b,fg=#C2BDA1'

# Clock mode
set -g clock-mode-colour '#6b8b6b'

# Copy mode highlighting
set -g mode-style 'bg=#2a4a4a,fg=#C2BDA1'